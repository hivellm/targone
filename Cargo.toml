[workspace]
resolver = "2"
members = ["crates/targone-core", "crates/cargo-targone"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/hivellm/targone"
authors = ["HiveLLM Contributors"]

[workspace.dependencies]
targone-core = { path = "crates/targone-core", version = "0.1.0" }
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
